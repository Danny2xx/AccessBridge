[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "accessbridge-ai"
version = "0.1.0"
description = "Equity-first transit accessibility and routing prototype for Birmingham."
readme = "README.md"
requires-python = ">=3.9,<3.14"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.8,<3",
    "numpy>=2.0,<2.3",
    "pandas>=2.2,<2.3",
    "geopandas>=1.0,<1.1",
    "pyogrio>=0.9,<0.12",
    "pyproj>=3.6,<3.7",
    "shapely>=2.0,<2.1",
    "pulp>=2.8,<3",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "mypy>=1.10,<2",
    "pytest>=8,<9",
    "ruff>=0.5,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP007", "UP045"]

[tool.mypy]
python_version = "3.9"
strict = true
warn_unused_configs = true
ignore_missing_imports = true
