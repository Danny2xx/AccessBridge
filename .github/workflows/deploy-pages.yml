name: Deploy to GitHub Pages

# Publishes the site as static files to the gh-pages branch, which GitHub
# Pages serves. The API responses come from the precomputed snapshot in
# frontend/public/api, written by scripts/export_static_api.py, so no server
# is needed. Publishing to a branch needs no Pages settings or extra tokens.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build the static site
        env:
          VITE_STATIC_API: "true"
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist
          force_orphan: true
          commit_message: "Publish the static site from ${{ github.sha }}"
