name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends coinor-cbc
      - run: pip install -e .[dev] openpyxl
      - name: Rebuild the processed data from open sources
        run: |
          python scripts/fetch_data.py
          python scripts/build_stage0_geography.py
          python scripts/build_stage0_stops.py
          python scripts/build_stage0_accessibility.py
          python scripts/build_stage7_travel_time_matrix.py
          python scripts/build_place_names.py
      - run: ruff check app tests scripts
      - run: mypy app tests
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
